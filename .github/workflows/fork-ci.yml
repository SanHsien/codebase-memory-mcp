name: Fork CI

# 維護層 gate（文件、工具、契約）。C 產品本體由上游的 pr.yml / dry-run.yml 驗證。
on:
  push:
    branches: [main]
    paths-ignore:
      - "src/**"
      - "internal/**"
      - "vendored/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-windows:
    name: gate (windows / py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maintenance dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Canonical Windows development gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev_check.ps1
